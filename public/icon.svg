<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a1a" rx="80"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow effect -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="280" font-weight="900" 
        text-anchor="middle" fill="#000000" opacity="0.3">75</text>
  
  <!-- Main text with gradient -->
  <text x="256" y="335" font-family="Arial, sans-serif" font-size="280" font-weight="900" 
        text-anchor="middle" fill="url(#textGradient)">75</text>
  
  <!-- Accent line -->
  <rect x="100" y="380" width="312" height="8" fill="url(#textGradient)" rx="4"/>
</svg>
