<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#1a1a1a" rx="30"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="textGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow effect -->
  <text x="96" y="128" font-family="Arial, sans-serif" font-size="105" font-weight="900" 
        text-anchor="middle" fill="#000000" opacity="0.3">75</text>
  
  <!-- Main text with gradient -->
  <text x="96" y="125" font-family="Arial, sans-serif" font-size="105" font-weight="900" 
        text-anchor="middle" fill="url(#textGradient192)">75</text>
  
  <!-- Accent line -->
  <rect x="37" y="142" width="118" height="3" fill="url(#textGradient192)" rx="1.5"/>
</svg>
