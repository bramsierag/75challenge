<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" fill="#1a1a1a" rx="28"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="textGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow effect -->
  <text x="90" y="120" font-family="Arial, sans-serif" font-size="98" font-weight="900" 
        text-anchor="middle" fill="#000000" opacity="0.3">75</text>
  
  <!-- Main text with gradient -->
  <text x="90" y="117" font-family="Arial, sans-serif" font-size="98" font-weight="900" 
        text-anchor="middle" fill="url(#textGradientApple)">75</text>
  
  <!-- Accent line -->
  <rect x="35" y="133" width="110" height="3" fill="url(#textGradientApple)" rx="1.5"/>
</svg>
